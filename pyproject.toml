[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "squeezebug"
version = "0.1.0"
description = "Shrink a real failing input (e.g. a huge production payload) to the smallest call that fails the same way, and turn it into a pytest regression test."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Aryan Ojha" }]
keywords = ["debugging", "delta-debugging", "test-case-reduction", "pytest", "minimal-reproducible-example", "llm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
squeezebug = "squeezebug.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
